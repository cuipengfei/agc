# oh-my-pi model configuration

providers:
  # ── OpenCode/Codex-compatible Responses endpoint ─────────────────────────────
  c8787:
    baseUrl: http://localhost:8787/v1
    apiKey: <REDACTED>
    api: openai-responses
    headers:
      x-session-id: <REDACTED>
    compat:
      supportsImageDetailOriginal: false
    models:
      - id: gpt-5.4
        compactionModel: c8787/gpt-5.6-luna
        name: GPT-5.4
        reasoning: true
        input: [text, image]
        contextWindow: 272000
        maxTokens: 16000
      - id: gpt-5.5
        compactionModel: c8787/gpt-5.6-luna
        name: GPT-5.5
        reasoning: true
        input: [text, image]
        contextWindow: 272000
        maxTokens: 16000
      - id: gpt-5.3-codex
        compactionModel: c8787/gpt-5.6-luna
        name: GPT-5.3 Codex
        reasoning: true
        input: [text, image]
        contextWindow: 272000
        maxTokens: 16000
      - id: gpt-5.4-mini
        compactionModel: c8787/gpt-5.6-luna
        name: gpt-5.4-mini
        reasoning: true
        input: [text, image]
        contextWindow: 272000
        maxTokens: 16000
      - id: gpt-5.6-sol
        compactionModel: c8787/gpt-5.6-luna
        name: GPT-5.6 Sol
        reasoning: true
        input: [text, image]
        contextWindow: 872000
        maxTokens: 16000
      - id: gpt-5.6-terra
        compactionModel: c8787/gpt-5.6-luna
        name: GPT-5.6 Terra
        reasoning: true
        input: [text, image]
        contextWindow: 272000
        maxTokens: 16000
      - id: gpt-5.6-luna
        compactionModel: c8787/gpt-5.6-luna
        name: GPT-5.6 Luna
        reasoning: true
        input: [text, image]
        contextWindow: 1050000
        maxTokens: 128000

  # ── Chat Completions endpoint for chat-only models (Gemini) ────────────────
  c8787-chat:
    baseUrl: http://localhost:8787/v1
    apiKey: <REDACTED>
    api: openai-completions
    headers:
      x-session-id: <REDACTED>
    models:
      - id: gemini-3.7-flash
        compactionModel: c8787/gpt-5.6-luna
        name: Gemini 3.7 Flash
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 64000
      - id: gemini-3.8-flash
        compactionModel: c8787/gpt-5.6-luna
        name: Gemini 3.8 Flash
        reasoning: true
        input: [text, image]
        contextWindow: 1048576
        maxTokens: 65536
      - id: kimi-k2.7-code
        compactionModel: c8787/gpt-5.6-luna
        name: Kimi K2.7 Code
        reasoning: true
        compat:
          omitReasoningEffort: true
        input: [text, image]
        contextWindow: 256000
        maxTokens: 32000

  justwoker:
    api: anthropic-messages
    baseUrl: "https://api.justwoker.icu"
    apiKey: "<REDACTED>"
    models:
      - id: claude-opus-5
        compactionModel: c8787/gpt-5.6-luna
        name: "Claude Opus 5"
        reasoning: true
        input: [text, image]
        contextWindow: 1000000
        maxTokens: 32768
        cost:
          input: 0.6
          output: 0.6
