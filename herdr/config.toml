onboarding = false

[theme]
name = "tokyo-night"

auto_switch = true
[ui]
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
status_indicators = "dots"
pane_scrollbars = true
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "
window_title = "{workspace}"
copy_on_select = true

[ui.sidebar.agents.rows_by_agent]
omp = [
  ["state_icon", "machine", "workspace", "tab"],
  ["terminal_title"],
  ["agent"],
]

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[session]
resume_agents_on_restore = true

[experimental]
pane_history = false
switch_ascii_input_source_in_prefix = false
kitty_graphics = false

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "annotate.open"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"

[[keys.command]]
key = "prefix+t"
type = "popup"
command = 'exec "${SHELL:-/bin/sh}"'
description = "临时 shell"
width = "80%"
height = "80%"

[[keys.command]]
key = "prefix+alt+b"
type = "pane"
command = "btop"
description = "系统监视器"
