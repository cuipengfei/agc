name: Tern maintenance checks
on:
  push:
    paths: ['tools/tern-maintain/**', 'tools/wiki-check/**', 'wiki/**', 'raw/**', '.github/workflows/tern-maintain.yml', '.pre-commit-config.yaml']
  pull_request:
    paths: ['tools/tern-maintain/**', 'tools/wiki-check/**', 'wiki/**', 'raw/**', '.github/workflows/tern-maintain.yml', '.pre-commit-config.yaml']
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install WABT 1.0.42
        run: |
          WABT_BIN="$(bash tools/tern-maintain/ci/install-wabt.sh "$RUNNER_TEMP/wabt")"
          echo "WABT_DIR=$WABT_BIN" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
      - name: Run Tern CI checks
        run: bash tools/tern-maintain/ci/check.sh
