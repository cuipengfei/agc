repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks
        stages: [pre-commit, pre-push]
  - repo: local
    hooks:
      - id: tern-ci-checks
        name: Tern quick checks
        entry: bash tools/tern-maintain/ci/check.sh --staged
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
