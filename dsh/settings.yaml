llm-deepseek:
  apiKeyEnv: DEEPSEEK_API_KEY
  baseURL: https://api.deepseek.com/v1
llm-pi-ai:
  providers:
    c4140:
      apiKeyEnv: C4140_API_KEY
      api: openai-responses
      baseURL: http://localhost:8787/v1
      retryPolicy:
        mode: normal
        backoff:
          initialDelayMs: 500
          maxDelayMs: 300000
        maxRetries: 3
      thinkingBudgets:
        minimal: 1024
        low: 2048
        medium: 8192
        high: 16384
        xhigh: 32768
        max: 32768
      models:
      - id: claude-fable-5
        name: claude-fable-5
      - id: gpt-5.4
        name: GPT-5.4
      - id: gpt-5.5
        name: GPT-5.5
      - id: gpt-5.3-codex
        name: GPT-5.3 Codex
      - id: gpt-5.4-mini
        name: gpt-5.4-mini
      - id: gpt-5.6-sol
        name: GPT-5.6 Sol
      - id: gpt-5.6-terra
        name: GPT-5.6 Terra
      - id: gpt-5.6-luna
        name: GPT-5.6 Luna
    c4140-chat:
